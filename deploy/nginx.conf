# VRS Lab Nginx site. server_name and the optional root redirect are filled in
# by deploy/setup.sh. Certbot --nginx adds the 443 server and the HTTP -> HTTPS
# redirect.

limit_req_zone $binary_remote_addr zone=vrs_check:10m rate=2r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    # Optional: 301 from the bare domain to the canonical www host.
    __ROOT_REDIRECT__

    root /opt/vrs;
    index index.html;
    charset utf-8;
    client_max_body_size 1m;
    limit_req_status 429;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/javascript text/css application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Proxy headers inherited by every proxied location below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # The versioned HTML shell is generated by the Python service, so a new
    # data.js / app.js build gets a fresh ?v= query string automatically.
    location = / {
        proxy_pass http://127.0.0.1:5173;
    }

    location = /index.html {
        proxy_pass http://127.0.0.1:5173;
    }

    location = /api/check {
        limit_req zone=vrs_check burst=2 nodelay;
        proxy_pass http://127.0.0.1:5173;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5173;
    }

    # Build metadata is tiny and must always be revalidated so open tabs can
    # notice a new snapshot quickly.
    location = /data/meta.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Versioned asset URLs are safe to cache for a year.
    location = /data.js {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /app.js {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /styles.css {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /favicon.ico {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Everything else is not part of the public site (scripts/, .git/, data/raw/).
    location / {
        return 404;
    }
}
